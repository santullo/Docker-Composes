# Redis + painel RedisInsight para desenvolvimento local.
# Uso: cp .env.example .env && docker compose up -d
name: redis

services:
  redis:
    image: redis:${REDIS_IMAGE_TAG:-8.8-alpine}
    container_name: redis
    restart: unless-stopped
    environment:
      # Lido pelo shell do comando abaixo e também pelo redis-cli
      # (REDISCLI_AUTH evita digitar a senha em `redis-cli` dentro do container).
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}
    # Persistência: AOF (fsync a cada segundo) + snapshots RDB.
    # A senha vem de variável de ambiente para não ficar gravada em arquivo versionado.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --save "3600 1 300 100 60 10000"
        --maxmemory ${REDIS_MAXMEMORY:-256mb}
        --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-noeviction}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redisinsight:
    # Painel web oficial do Redis (navegar por chaves, rodar comandos, ver métricas)
    image: redis/redisinsight:${REDISINSIGHT_IMAGE_TAG:-3.8.0}
    container_name: redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Aceita os termos de uso na primeira abertura
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      # Cadastra automaticamente a conexão com o Redis deste Compose
      # (endereço interno do Docker: não usar localhost aqui)
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: redis-local
      RI_REDIS_USERNAME: default
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no arquivo .env}
    ports:
      # Painel em http://localhost:5540
      - "${BIND_ADDRESS:-127.0.0.1}:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      # Guarda preferências e conexões extras cadastradas no painel
      - insight-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5540/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  data:
  insight-data:
