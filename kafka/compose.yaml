# Apache Kafka (modo KRaft, sem ZooKeeper) + Kafka UI para desenvolvimento local.
# Uso: cp .env.example .env && docker compose up -d
name: kafka

services:

  kafka:

    # Nome fixo do container (facilita debug e logs)
    container_name: kafka

    # Imagem da Confluent com Apache Kafka (8.3.x = Kafka 4.3, somente KRaft)
    image: confluentinc/cp-kafka:${KAFKA_IMAGE_TAG:-8.3.2}

    restart: unless-stopped

    ports:
      # Expõe o Kafka para aplicações no host (Spring Boot fora do Docker).
      # A porta do container é sempre 9092; a do host é configurável.
      - "${BIND_ADDRESS:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"

    environment:

      # =========================
      # IDENTIFICAÇÃO DO BROKER
      # =========================

      # ID único do broker (em cluster real, cada um tem um ID)
      KAFKA_NODE_ID: 1

      # Kafka rodando em modo KRaft (sem Zookeeper): o mesmo nó é broker e controller
      KAFKA_PROCESS_ROLES: broker,controller

      # =========================
      # LISTENERS (CANAIS DE COMUNICAÇÃO)
      # =========================

      # Define onde o Kafka escuta conexões
      # PLAINTEXT -> externo (host)
      # PLAINTEXT_INTERNAL -> containers Docker
      # CONTROLLER -> coordenação do cluster KRaft
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093

      # Define como o Kafka "se anuncia" para os clientes
      # localhost:<KAFKA_PORT> -> aplicações fora do Docker (Spring Boot local)
      # kafka:29092 -> outros containers dentro da rede Docker
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},PLAINTEXT_INTERNAL://kafka:29092

      # Mapeia os protocolos usados por cada listener
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Define qual listener será usado para comunicação entre brokers
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      # Listener responsável pelo controller (KRaft)
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Define o quorum do controller (cluster metadata)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # =========================
      # CONFIGURAÇÃO SINGLE BROKER (DEV)
      # =========================

      # Evita replicação para múltiplos brokers (ambiente local)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Consumidores entram no grupo sem esperar 3 s (agiliza testes locais)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # ID único do cluster KRaft.
      # Não altere com dados existentes no volume: o broker recusa iniciar
      # se o ID não corresponder ao gravado em meta.properties.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      # Persistência de tópicos, mensagens, offsets e metadados do KRaft
      - data:/var/lib/kafka/data

    healthcheck:
      # Considera saudável quando o broker responde a requisições de API
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s


  kafka-ui:

    # Nome do container da interface web
    container_name: kafka-ui

    # Kafbat UI: continuação mantida do provectuslabs/kafka-ui
    # (tópicos, mensagens, consumer groups, brokers)
    image: kafbat/kafka-ui:${KAFKA_UI_IMAGE_TAG:-v1.5.0}

    restart: unless-stopped

    # Garante que o Kafka esteja pronto antes da UI
    depends_on:
      kafka:
        condition: service_healthy

    ports:
      # Evita conflito com Spring Boot (8080)
      # UI ficará em http://localhost:19000
      - "${BIND_ADDRESS:-127.0.0.1}:${KAFKA_UI_PORT:-19000}:8080"

    environment:

      # Nome do cluster exibido na interface
      KAFKA_CLUSTERS_0_NAME: local

      # Endereço interno do Kafka dentro do Docker
      # (IMPORTANTE: não usar localhost aqui)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  data:
